services:
  ligneous-gedcom-lib-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      # Optional: bind loopback only (host still publishes 8091:8091 to the outside).
      # - LISTEN_ADDR=127.0.0.1:8091
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
